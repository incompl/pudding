<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pudding</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <header id="topbar" data-tauri-drag-region>
      <div id="tabs" role="tablist" data-tauri-drag-region>
        <button class="tab active" type="button" role="tab" data-tab="files">Files</button>
        <button class="tab" type="button" role="tab" data-tab="streams">Streams</button>
      </div>
      <div id="topbar-splitter-spacer" data-tauri-drag-region></div>
      <div id="topbar-actions" data-tauri-drag-region>
        <div id="search">
          <input
            type="search"
            id="search-input"
            placeholder="Search…"
            spellcheck="false"
            autocomplete="off"
            aria-label="Search library and streams"
          />
          <div id="search-results" class="hidden" role="listbox"></div>
        </div>
        <div id="playback-modes" role="group" aria-label="Playback mode">
          <button id="mode-shuffle" class="mode-btn" type="button" aria-label="Shuffle" title="Shuffle" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22" />
              <path d="m18 2 4 4-4 4" />
              <path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2" />
              <path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8" />
              <path d="m18 14 4 4-4 4" />
            </svg>
          </button>
          <button id="mode-repeat" class="mode-btn" type="button" aria-label="Repeat off" title="Repeat off">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m17 2 4 4-4 4" />
              <path d="M3 11v-1a4 4 0 0 1 4-4h14" />
              <path d="m7 22-4-4 4-4" />
              <path d="M12 18H3" />
              <path class="repeat-loop-br" d="M21 13v1a4 4 0 0 1-4 4H12" />
              <path class="repeat-one-mark" d="M18 14 16 15.5m2-1.5v7m-2.5 0h5" />
            </svg>
          </button>
        </div>
        <button id="miniplayer-btn" type="button" aria-label="Mini player" title="Mini player">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="4 14 10 14 10 20" />
            <polyline points="20 10 14 10 14 4" />
            <line x1="14" y1="10" x2="21" y2="3" />
            <line x1="3" y1="21" x2="10" y2="14" />
          </svg>
        </button>
        <button id="settings-back-btn" class="hidden" type="button">Back</button>
        <button id="expand-btn" type="button" aria-label="Expand" title="Expand">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="15 3 21 3 21 9" />
            <polyline points="9 21 3 21 3 15" />
            <line x1="21" y1="3" x2="14" y2="10" />
            <line x1="3" y1="21" x2="10" y2="14" />
          </svg>
        </button>
      </div>
    </header>
    <main id="main-view">
      <section id="left">
        <div class="tab-panel" id="tab-files">
          <div id="folder-tree"></div>
        </div>
        <div class="tab-panel hidden" id="tab-streams">
          <div id="streams-list"></div>
        </div>
      </section>
      <div id="splitter" role="separator" aria-orientation="vertical"></div>
      <section id="right">
        <div id="now-playing-panel">
          <div id="queue-view">
            <div id="queue-header">
              <div id="queue-header-text">
                <div id="queue-title"></div>
                <div id="queue-subtitle"></div>
              </div>
              <button id="queue-close-btn" type="button" title="Close queue" aria-label="Close queue">Close</button>
            </div>
            <ul id="queue-list"></ul>
          </div>
          <!-- The now-playing hero: a full-pane card when no queue is active, and
               a compact strip above the controls when one is (see styles.css). -->
          <div id="now-playing-main">
            <p id="now-playing-empty" class="empty-state">Pudding time.</p>
            <img id="now-playing-art" class="hidden" alt="" />
            <div id="now-playing-text">
              <p id="now-playing-title"><span class="marquee-inner"></span></p>
              <p id="now-playing-artist" class="hidden"><span class="marquee-inner"></span></p>
              <p id="now-playing-album" class="hidden"><span class="marquee-inner"></span></p>
              <div id="now-playing-stream-meta" class="hidden">
                <p id="stream-meta-song"><span class="marquee-inner"></span></p>
                <p id="stream-meta-artist" class="hidden"><span class="marquee-inner"></span></p>
              </div>
            </div>
          </div>
          <!-- One-line current-track indicator shown above the controls while a
               queue is playing (the card is hidden then; see styles.css). -->
          <p id="now-playing-strip"><span id="np-strip-artist-wrap" class="hidden"><span id="np-strip-artist"></span> - </span><span id="np-strip-title"></span></p>
          <div id="now-playing-controls">
            <button id="play-pause-btn" type="button" aria-label="Play" disabled>▶</button>
            <button id="prev-btn" class="skip-btn" type="button" aria-label="Previous" disabled>
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5v14h2V5H6zm3 7l10 7V5l-10 7z" /></svg>
            </button>
            <span id="time-current" class="time">0:00</span>
            <input type="range" id="seek-bar" min="0" max="0" value="0" step="0.1" disabled />
            <span id="live-indicator" class="hidden">Live Broadcast</span>
            <span id="time-remaining" class="time">-0:00</span>
            <button id="next-btn" class="skip-btn" type="button" aria-label="Next" disabled>
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18 5v14h-2V5h2zm-3 7L5 19V5l10 7z" /></svg>
            </button>
            <div id="volume-control">
              <button id="volume-btn" type="button" aria-label="Volume">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor" />
                  <path class="volume-wave" d="M15.54 8.46a5 5 0 0 1 0 7.07" />
                  <path class="volume-wave" d="M19.07 4.93a10 10 0 0 1 0 14.14" />
                </svg>
              </button>
              <div id="volume-popover">
                <input type="range" id="volume-bar" min="0" max="1" step="0.01" value="1" aria-label="Volume" />
              </div>
            </div>
          </div>
        </div>
        <div id="settings-panel" class="hidden">
          <h2>Settings</h2>
          <div class="setting">
            <label for="library-root">Library root</label>
            <div class="path-picker">
              <input type="text" id="library-root" spellcheck="false" readonly placeholder="No folder selected" />
              <button type="button" id="library-root-browse">Choose…</button>
            </div>
          </div>
          <div class="setting">
            <label for="manifest-path">Manifest path</label>
            <div class="path-picker">
              <input type="text" id="manifest-path" spellcheck="false" placeholder="Choose a file or paste a URL" />
              <button type="button" id="manifest-path-browse">Choose…</button>
            </div>
          </div>
          <p class="credit">vibed by the best<br/><a href="https://incompl.com">incompl.com</a></p>
        </div>
      </section>
    </main>
    <div id="toast" aria-live="polite"></div>
  </body>
</html>
