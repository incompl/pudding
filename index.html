<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pudding</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <header id="topbar" data-tauri-drag-region>
      <div id="tabs" role="tablist" data-tauri-drag-region>
        <button class="tab active" type="button" role="tab" data-tab="files">Files</button>
        <button class="tab" type="button" role="tab" data-tab="streams">Streams</button>
      </div>
      <div id="topbar-splitter-spacer" data-tauri-drag-region></div>
      <div id="topbar-actions" data-tauri-drag-region>
        <div id="search">
          <input
            type="search"
            id="search-input"
            placeholder="Search…"
            spellcheck="false"
            autocomplete="off"
            aria-label="Search library and streams"
          />
          <div id="search-results" class="hidden" role="listbox"></div>
        </div>
        <div id="playback-modes" role="group" aria-label="Playback mode">
          <button id="mode-shuffle" class="mode-btn" type="button" aria-label="Shuffle" title="Shuffle" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22" />
              <path d="m18 2 4 4-4 4" />
              <path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2" />
              <path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8" />
              <path d="m18 14 4 4-4 4" />
            </svg>
          </button>
          <button id="mode-repeat" class="mode-btn" type="button" aria-label="Repeat off" title="Repeat off">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m17 2 4 4-4 4" />
              <path d="M3 11v-1a4 4 0 0 1 4-4h14" />
              <path d="m7 22-4-4 4-4" />
              <path d="M12 18H3" />
              <path class="repeat-loop-br" d="M21 13v1a4 4 0 0 1-4 4H12" />
              <path class="repeat-one-mark" d="M18 14 16 15.5m2-1.5v7m-2.5 0h5" />
            </svg>
          </button>
        </div>
        <button id="miniplayer-btn" type="button" aria-label="Mini player" title="Mini player">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="4 14 10 14 10 20" />
            <polyline points="20 10 14 10 14 4" />
            <line x1="14" y1="10" x2="21" y2="3" />
            <line x1="3" y1="21" x2="10" y2="14" />
          </svg>
        </button>
        <button id="settings-back-btn" class="hidden" type="button">Back</button>
        <button id="expand-btn" type="button" aria-label="Expand" title="Expand">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="15 3 21 3 21 9" />
            <polyline points="9 21 3 21 3 15" />
            <line x1="21" y1="3" x2="14" y2="10" />
            <line x1="3" y1="21" x2="10" y2="14" />
          </svg>
        </button>
      </div>
    </header>
    <main id="main-view">
      <section id="left">
        <div class="tab-panel" id="tab-files">
          <!-- Get-started prompt shown across the whole Files panel until a
               library folder is configured; hides the navigator/tree/footer.
               Toggled by the files-empty effect in src/main.ts. -->
          <div id="files-empty" class="panel-empty hidden">
            To see files, add a library folder in
            <button id="files-empty-settings" type="button" class="link-btn">settings</button>.
          </div>
          <!-- Library browse-mode navigator (Replace + back): the root mode menu
               and drill-down bodies render here; #folder-tree below is un-hidden
               only in Browse mode. See src/library-nav.ts. -->
          <div id="library-nav"></div>
          <div id="folder-tree"></div>
          <button id="create-playlist-btn" class="list-add-btn" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="12" y1="4" x2="12" y2="20" />
              <line x1="4" y1="12" x2="20" y2="12" />
            </svg>
            <span>Create playlist</span>
          </button>
        </div>
        <div class="tab-panel hidden" id="tab-streams">
          <!-- Get-started prompt shown until a stream list path is configured;
               replaces the streams list. Toggled by the streams-empty effect. -->
          <div id="streams-empty" class="panel-empty hidden">
            To see streams, add a stream list  in
            <button id="streams-empty-settings" type="button" class="link-btn">settings</button>.
          </div>
          <div id="streams-list"></div>
          <button id="add-station-btn" class="list-add-btn" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="12" y1="4" x2="12" y2="20" />
              <line x1="4" y1="12" x2="20" y2="12" />
            </svg>
            <span>Add stream</span>
          </button>
        </div>
        <!-- Library-scan progress: a fixed footer of the left pane, collapsed to
             zero height at rest and revealing a thin determinate bar + count only
             while a scan is in flight. Driven by the scan-started/scan-progress/
             library-scanned events in src/main.ts. -->
        <div id="scan-status">
          <div id="scan-status-track"><div id="scan-status-fill"></div></div>
          <span id="scan-status-label"></span>
        </div>
      </section>
      <div id="splitter" role="separator" aria-orientation="vertical"></div>
      <section id="right">
        <div id="now-playing-panel">
          <!-- The list face: the ephemeral queue, or an open playlist. Which one
               (and its title/Clear affordance) is decided in renderQueue. -->
          <div id="queue-view">
            <div id="queue-header">
              <div id="queue-header-text">
                <div id="queue-title">
                  <span id="queue-title-text"></span>
                  <button id="queue-rename-btn" class="hidden" type="button" title="Rename playlist" aria-label="Rename playlist">✎</button>
                </div>
                <div id="queue-subtitle"></div>
              </div>
              <button id="queue-close-btn" type="button" title="Clear queue" aria-label="Clear queue">Clear</button>
            </div>
            <ul id="queue-list"></ul>
          </div>
          <!-- The now-playing hero face: the full-pane card, shown whenever the
               list face isn't up (see styles.css). -->
          <div id="now-playing-main">
            <p id="now-playing-empty" class="empty-state">Pudding time.</p>
            <img id="now-playing-art" class="hidden" alt="" />
            <div id="now-playing-text">
              <p id="now-playing-title"><span class="marquee-inner"></span></p>
              <p id="now-playing-artist" class="hidden np-link"><span class="marquee-inner"></span></p>
              <p id="now-playing-album" class="hidden np-link"><span class="marquee-inner"></span></p>
              <div id="now-playing-stream-meta" class="hidden">
                <p id="stream-meta-song"><span class="marquee-inner"></span></p>
                <p id="stream-meta-artist" class="hidden"><span class="marquee-inner"></span></p>
              </div>
            </div>
          </div>
          <!-- The editor face: a third face that takes the pane when editing a
               track's tags or a stream (see openPaneEditor). Shown by
               `.show-editor`, which hides the hero, list, and nav bar; closing it
               reveals whatever face was underneath, so you land back where you
               were. The form itself is built by buildInlineEditor. -->
          <div id="pane-editor-view"></div>
          <!-- The nav bar: one line pinned above the transport whenever a list
               exists, carrying the source context and the button that swaps the
               two faces (see renderNavBar / .has-nav in styles.css). -->
          <div id="nav-bar">
            <span id="nav-bar-text"></span>
            <button id="nav-bar-alt-btn" class="hidden" type="button"></button>
            <button id="nav-bar-btn" type="button"></button>
          </div>
          <div id="now-playing-controls">
            <button id="play-pause-btn" type="button" aria-label="Play" disabled>▶</button>
            <button id="prev-btn" class="skip-btn" type="button" aria-label="Previous" disabled>
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5v14h2V5H6zm3 7l10 7V5l-10 7z" /></svg>
            </button>
            <span id="time-current" class="time">0:00</span>
            <input type="range" id="seek-bar" min="0" max="0" value="0" step="0.1" disabled />
            <span id="live-indicator" class="hidden">Live Broadcast</span>
            <span id="time-remaining" class="time">-0:00</span>
            <button id="next-btn" class="skip-btn" type="button" aria-label="Next" disabled>
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18 5v14h-2V5h2zm-3 7L5 19V5l10 7z" /></svg>
            </button>
            <div id="volume-control">
              <button id="volume-btn" type="button" aria-label="Volume">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor" />
                  <path class="volume-wave" d="M15.54 8.46a5 5 0 0 1 0 7.07" />
                  <path class="volume-wave" d="M19.07 4.93a10 10 0 0 1 0 14.14" />
                </svg>
              </button>
              <div id="volume-popover">
                <input type="range" id="volume-bar" min="0" max="1" step="0.01" value="1" aria-label="Volume" />
              </div>
            </div>
          </div>
        </div>
        <div id="settings-panel" class="hidden">
          <h2>Settings</h2>
          <div class="setting">
            <label>Library folders</label>
            <!-- One .path-picker row per configured folder (input + Choose… + ×),
                 rendered by renderLibraryRootRows in src/main.ts. -->
            <div id="library-roots"></div>
            <button type="button" id="library-root-add" class="list-add-btn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="12" y1="4" x2="12" y2="20" />
                <line x1="4" y1="12" x2="20" y2="12" />
              </svg>
              <span>Add library folder</span>
            </button>
          </div>
          <div class="setting">
            <label for="stream-list-path">Stream list</label>
            <div class="path-picker">
              <input type="text" id="stream-list-path" spellcheck="false" placeholder="Choose a file or paste a URL" />
              <button type="button" id="stream-list-path-browse">Choose…</button>
            </div>
          </div>
          <div class="setting">
            <label>Theme</label>
            <label class="theme-match-system">
              <input type="checkbox" id="theme-match-system" />
              <span>Match system light / dark mode</span>
            </label>
            <!-- A Dark group and a Light group of preview cards, rendered by
                 renderThemePicker in src/main.ts. Off: one card selected across
                 both groups pins the mode. On: one per group, auto-swapping with
                 the OS. -->
            <div id="theme-swatches" class="theme-swatches"></div>
          </div>
        </div>
        <!-- About shares the right pane with Settings (same Back button). The
             version line is filled in by setupAbout in src/main.ts. -->
        <div id="about-panel" class="hidden">
          <div id="about-body">
            <p id="about-version" class="about-version">pudding</p>
            <p class="credit">vibed by the best<br/><a href="https://incompl.com">incompl.com</a></p>
          </div>
        </div>
      </section>
    </main>
    <div id="toast" aria-live="polite"></div>
  </body>
</html>
